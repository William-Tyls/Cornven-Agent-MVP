openapi: 3.0.3
info:
  title: Cornven MVP API
  version: 0.3.0
  description: Contract-first boundary for POS raw records, deterministic Rental-rate settlement,
    reconciliation, and the internal read-only assistant. Customer repository fields remain isolated
    behind the adapter.
servers:
  - url: http://127.0.0.1:3119
    description: Isolated local integration API
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check API readiness
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - version
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
                  version:
                    type: string
  /api/v1/imports/mock/normalize:
    post:
      operationId: normalizeMockImport
      summary: Normalize raw POS sale/refund records and isolate exchange audit events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawPosImportRequest'
      responses:
        '200':
          description: Normalization result
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - records
                  - auditEvents
                properties:
                  summary:
                    $ref: '#/components/schemas/ImportValidationSummary'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/CanonicalSale'
                  auditEvents:
                    type: array
                    items:
                      $ref: '#/components/schemas/PosAuditEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/imports/csv/normalize:
    post:
      operationId: normalizeCsvImport
      summary: Parse CSV text and normalize raw POS sale/refund records
      description: The frontend reads the selected CSV file as text and sends that text in the csv
        property. This prototype endpoint validates and normalizes data only; it does not yet create
        a persisted import batch or write records to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvPosImportRequest'
      responses:
        '200':
          description: CSV normalization result
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - records
                  - auditEvents
                properties:
                  summary:
                    $ref: '#/components/schemas/ImportValidationSummary'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/CanonicalSale'
                  auditEvents:
                    type: array
                    items:
                      $ref: '#/components/schemas/PosAuditEvent'
        '400':
          $ref: '#/components/responses/CsvValidationError'
  /api/v1/settlements/preview:
    post:
      operationId: previewSettlement
      summary: Calculate an artist monthly report from supplied M2 context
      description:
        Pure calculation; no database reads or writes. M2 supplies normalized sales, required
        historical records, rental metadata and inventory context. Missing context remains
        explicitly unknown. The legacy Agent tool declaration requires separate M5 adaptation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementPreviewInput'
      responses:
        '200':
          description: Deterministic settlement preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/assistant/tools:
    get:
      operationId: listAssistantTools
      summary: List declared read-only Agent tools
      responses:
        '200':
          description: Tool registry
          content:
            application/json:
              schema:
                type: object
                required:
                  - topologyStatus
                  - tools
                properties:
                  topologyStatus:
                    type: string
                    enum:
                      - proposed
                  tools:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - description
                        - owner
                        - readOnly
                        - input
                        - output
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        owner:
                          type: string
                        readOnly:
                          type: boolean
                          enum:
                            - true
                        input:
                          $ref: '#/components/schemas/ToolObjectSchema'
                        output:
                          $ref: '#/components/schemas/ToolObjectSchema'
  /api/v1/assistant:
    post:
      operationId: askAssistant
      summary: Classify one request with GPT-5.4 nano and execute a read-only tool
      description:
        Optional bounded conversation history supports clarification. No client permissions or
        arbitrary tool calls. Requires server OPENAI_API_KEY. Saved report reads do not recalculate.
        SOP answers require validated source citations.
      requestBody: &a12
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
      responses:
        '200':
          description: Answer, clarification, refusal or tool error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantAnswer'
        '400': &a1
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': &a2
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403': &a3
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404': &a4
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409': &a5
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410': &a6
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500': &a7
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Invalid model response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503': &a8
          description: ErrorEnvelope; report errors follow monthly-report-integration.zh-CN.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Model timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/documents/status:
    get:
      operationId: getDocumentModuleStatus
      summary: Report whether approved SOP documents are configured
      description:
        Requires document permission tags injected by the trusted authentication or Assistant
        boundary. Requests without an authorised server context are denied.
      responses:
        '200':
          description: Module status
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - indexedDocuments
                  - indexedChunks
                  - embeddingProvider
                  - message
                properties:
                  status:
                    type: string
                    enum:
                      - not_configured
                      - ready
                  indexedDocuments:
                    type: integer
                    minimum: 0
                  indexedChunks:
                    type: integer
                    minimum: 0
                  embeddingProvider:
                    type: string
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/documents/search:
    post:
      operationId: searchDocuments
      summary: Search authorised SOP chunks for citation-ready evidence
      description:
        The request cannot choose its own permissions. The server injects the caller's approved
        permission tags before retrieval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSearchInput'
      responses:
        '200':
          description: Permission-filtered document evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchOutput'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '502':
          description: RAG_EVIDENCE_INVALID; source or citation integrity failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: RAG_CONFIG_INVALID, RAG_INDEX_UNAVAILABLE, RAG_PROVIDER_UNAVAILABLE or
            RAG_CAPACITY_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: RAG_PROVIDER_TIMEOUT; no automatic retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/artists:
    get:
      operationId: listReportArtists
      summary: List artists within the trusted actor scope
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
            default: ''
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2000
      responses:
        '200':
          description: Paginated artists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistListResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/reports:
    post:
      operationId: generateCurrentMonthReport
      summary: Generate and save a draft report through server time
      description: Local integration uses an explicit server-side development identity on loopback.
        Production requires a trusted identity resolver. Month/asOf are never accepted from the
        browser.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateMonthlyReportRequest'
      responses:
        '200':
          description: Same request replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateMonthlyReportResponse'
        '201':
          description: New saved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateMonthlyReportResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
    get:
      operationId: listSavedReports
      summary: List saved reports in descending generatedAt and reportId order
      parameters:
        - name: artistId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: settlementMonth
          in: query
          required: false
          schema:
            type: string
            pattern: ^[2-9]\d{3}-(?:0[1-9]|1[0-2])$
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2000
      responses:
        '200':
          description: Saved reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/reports/{reportId}:
    get:
      operationId: getSavedReport
      summary: Read saved report JSON without recalculating
      parameters:
        - &a9
          name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReportDocument'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/reports/{reportId}/download:
    get:
      operationId: downloadSavedReport
      summary: Download private saved PDF
      parameters:
        - *a9
      responses:
        '200':
          description: PDF attachment
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/imports/batches:
    post:
      operationId: validateCsvBatch
      summary: Save and validate a CSV batch without importing transactions
      description:
        Local Plan B workflow; login is intentionally not included. Maximum 500 KB / 1000 rows.
        The response may have FAILED status with persisted row errors. Reuploading identical
        contents with the same rate unit reuses the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvBatchUpload'
      responses:
        '201':
          description: Saved batch and validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvBatch'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: CSV exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listCsvBatches
      summary: List persisted CSV batches, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - VALIDATED
              - FAILED
              - IMPORTED
      responses:
        '200':
          description: Batch history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvBatchList'
        '400':
          description: Invalid filter or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/imports/batches/{batchId}:
    get:
      operationId: getCsvBatch
      summary: Read a saved batch, preview and row errors
      parameters:
        - &a10
          name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Saved batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvBatch'
        '404':
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/imports/batches/{batchId}/confirm:
    post:
      operationId: confirmCsvBatch
      summary: Revalidate saved input and atomically import a batch
      parameters:
        - *a10
      description:
        Only batchId is accepted. No client-supplied records are trusted. A domain validation
        failure returns status FAILED and writes no transactions. Successful retries return the same
        saved result. New reports include committed transactions; previous report snapshots remain
        unchanged.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: IMPORTED, or FAILED after revalidation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvBatch'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/settlements/monthly-preview:
    post:
      operationId: previewMonthlySettlement
      summary: Read artist/month data and calculate a settlement preview without saving
      description:
        Local Plan B read-only preview. artistId is an internal UUID returned by GET /artists.
        Current month uses server time in Asia/Taipei; earlier months use the full month; future
        months are rejected. dataCutoff is inclusive. M3 result.settlementPeriod.asOf for a closed
        month is the exclusive next-month boundary. No reports, tasks, PDFs or approval records are
        created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlySettlementPreviewRequest'
      responses:
        '200':
          description: Read-only M3 result with inclusive data cutoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySettlementPreviewResponse'
        '400':
          description: Invalid request or future month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Settlement data unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/assistant/tools/settlement.preview:
    post:
      operationId: invokeSettlementPreviewTool
      summary: Read artist/month data and calculate a settlement preview without saving
      description:
        Local Plan B read-only preview. artistId is an internal UUID returned by GET /artists.
        Current month uses server time in Asia/Taipei; earlier months use the full month; future
        months are rejected. dataCutoff is inclusive. M3 result.settlementPeriod.asOf for a closed
        month is the exclusive next-month boundary. No reports, tasks, PDFs or approval records are
        created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlySettlementPreviewRequest'
      responses:
        '200':
          description: Read-only M3 result with inclusive data cutoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySettlementPreviewResponse'
        '400':
          description: Invalid request or future month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Settlement data unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/assistant/tools/settlement.get:
    post:
      operationId: readSavedSettlement
      summary: Read the latest saved monthly report without calculating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSettlementQuery'
      responses:
        '200':
          description: Saved report or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSettlementResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/assistant/status:
    get:
      operationId: getAssistantStatus
      summary: Check model configuration and business runtime availability (not a live connectivity probe)
      responses:
        '200':
          description: Configured flag, model name and available intents
          content:
            application/json:
              schema:
                type: object
                required:
                  - configured
                  - model
                  - availableIntents
                properties:
                  configured:
                    type: boolean
                  model:
                    type: string
                  availableIntents:
                    type: array
                    items:
                      type: string
  /api/v1/assistant/tools/sales.refunds:
    post:
      operationId: readMonthlyRefundMetrics
      summary: Read monthly refund item units, transactions and amount without settlement calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyRefundMetricsRequest'
      responses:
        '200':
          description:
            Refund event metrics; quantity is positive item units, transaction count is distinct
            sourceTransactionId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyRefundMetricsResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/approvals:
    get:
      operationId: listMonthlyReportApprovals
      summary: List saved report versions by review status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: &a34
              - draft
              - pending
              - approved
              - rejected
        - name: artistQuery
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: settlementMonth
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated review queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/approvals/{reportId}:
    get:
      operationId: getMonthlyReportApproval
      summary: Read saved snapshot, review status and audit history
      parameters:
        - *a9
      responses:
        '200':
          description: Version-specific approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDetail'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/approvals/{reportId}/actions:
    post:
      operationId: actOnMonthlyReportApproval
      summary: Submit, approve or reject a saved report version
      description: Rejection requires a nonblank reason. requestId is an idempotency key per report
        version; reuse with different content returns 409. Only draft -> pending ->
        approved/rejected is allowed. Actor comes from server identity. Does not modify report
        JSON/PDF or execute payment.
      parameters:
        - *a9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCommand'
      responses:
        '200':
          description: Current status and history after action or replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDetail'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/deliveries/config:
    get:
      operationId: getDeliveryConfig
      summary: Email channel and Taipei monthly schedule
      responses:
        '200':
          description: Configuration, not a live connectivity check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryConfig'
        '400': *a1
        '401': *a2
        '403': *a3
        '404': *a4
        '409': *a5
        '410': *a6
        '500': *a7
        '503': *a8
  /api/v1/deliveries:
    get:
      operationId: listReportDeliveries
      parameters:
        - name: artistId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: settlementMonth
          in: query
          required: false
          schema:
            type: string
            pattern: ^[2-9]\d{3}-(?:0[1-9]|1[0-2])$
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: &a35
              - queued
              - sending
              - sent
              - failed
              - unknown
              - skipped
