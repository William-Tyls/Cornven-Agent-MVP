      summary: View or download a registered SOP PDF or image in the current trusted scope
      description: Server-side asset whitelist and byte checksum validation. Local demo identity is
        permitted only outside production. No arbitrary paths or remote URL proxy. PDF contents are
        not necessarily indexed.
      parameters:
        - name: assetId
