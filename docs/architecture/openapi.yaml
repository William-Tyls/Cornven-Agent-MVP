  /api/v1/assistant/stream:
    post:
      operationId: streamAssistant
      summary: Stream assistant progress and provisional SOP answer text over SSE
      description:
        POST with the same input as askAssistant. SSE data is an AssistantStreamEvent JSON
        object; event names are status, text_delta, final and error. Only final contains a validated
        answer with citations/results and replaces provisional text. A stream without final/error is
        incomplete. Disconnect cancels model work; no automatic retry or replay. Business answers
        are deterministic and delivered in final. Pre-stream failures use HTTP ErrorEnvelope; later
        failures use an error event. Comment heartbeats may occur.
      requestBody: *a12
      responses:
        '200':
          description: SSE events with JSON payloads described by AssistantStreamEvent
          content:
            text/event-stream:
              schema:
                type: string
